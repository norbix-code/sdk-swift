name: Release

# Swift packages have no registry: SwiftPM resolves versions from git tags.
# A release is therefore the `vX.Y.Z` tag plus its GitHub Release, both created
# by semantic-release from conventional commits since the last tag:
# `feat:` → minor, `fix:` → patch, `feat!:` / `BREAKING CHANGE:` → major.
# `chore:`, `ci:`, `test:` don't release.
#
# `main` is protected (changes only through pull requests), so the release does
# NOT commit back (no CHANGELOG.md commit); release notes live on GitHub
# Releases.
#
# The baseline tag `v0.0.0` marks the root commit so the first release is 0.1.0
# instead of semantic-release's default 1.0.0.

on:
  push:
    branches: [main, next, beta]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: semantic-release
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # semantic-release needs the full history and tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Sync branch tip
        # A run checks out its triggering SHA. When several merges land close
        # together that SHA is already behind origin and semantic-release
        # refuses to release; release from the remote tip instead.
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"

      # A tag is only worth creating if the package builds and its tests pass
      # at that commit — SwiftPM consumers resolve exactly this tree.
      - name: Swift build
        run: swift build

      - name: Swift test
        run: swift test

      - name: Setup Node (release tooling)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install release tooling
        run: npm ci --no-audit --no-fund

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Summary
        if: always()
        run: |
          echo "### Release · ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -n "$TAG" ]; then
            echo "Latest tag: \`${TAG}\` — notes: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG}" >> $GITHUB_STEP_SUMMARY
          fi
