name: CI

on:
  pull_request:
  push:
    branches: [main, next, beta]

permissions:
  contents: read

jobs:
  test:
    name: swift test · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The package needs the Swift 6 toolchain (`swift-tools-version: 6.0`;
        # Swift 5 was dropped in 2026-11, owner decision). macos-15 has the
        # oldest Xcode with Swift 6, macos-26 the newest. The manifest must
        # resolve on both.
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v7
      # Note: SDK generation (sync_types + generate_endpoints) is a developer
      # task run locally via `make generate`. CI never regenerates — the
      # handwritten and generated code committed in Sources/ must compile and
      # pass tests on its own.
      - name: Toolchain
        run: swift --version
      - name: Swift build
        run: swift build
      - name: Swift test
        run: swift test
