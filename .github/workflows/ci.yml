name: CI

on:
  pull_request:
  push:
    branches: [main, next, beta]

permissions:
  contents: read

jobs:
  test:
    name: swift test · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15 is the oldest macOS runner GitHub still offers (macos-14 was
        # retired in 2026-11); macos-26 has the newest Xcode. The manifest
        # (`swift-tools-version: 5.9`) must resolve on both (it broke on
        # Swift 6 in 2026-09).
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v7
      # Note: SDK generation (sync_types + generate_endpoints) is a developer
      # task run locally via `make generate`. CI never regenerates — the
      # handwritten and generated code committed in Sources/ must compile and
      # pass tests on its own.
      - name: Toolchain
        run: swift --version
      - name: Swift build
        run: swift build
      - name: Swift test
        run: swift test
